<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/mygroove-symbol.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="MyGroove" />
    <meta name="description" content="MyGroove — Cloud music player streaming audio directly from Google Drive and Cloudflare R2." />
    <meta property="og:site_name" content="MyGroove" />
    <meta property="og:title" content="MyGroove — Cloud Music Player" />
    <meta property="og:description" content="Stream audio seamlessly from Google Drive and cloud buckets." />
    <meta property="og:image" content="/mygroove-symbol.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MyGroove — Cloud Music Player" />
    <meta name="twitter:description" content="Stream audio seamlessly from Google Drive and cloud buckets." />
    <meta name="twitter:image" content="/mygroove-symbol.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyGroove" />
    <title>MyGroove — Cloud Music Player</title>
    <!-- Modern typography from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('mygroove_theme') || localStorage.getItem('drivebeats_theme');
          var isDark = t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0d1117');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#ffffff');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-brand-500 selection:text-white min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
